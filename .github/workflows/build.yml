name: Build community candidate
on:
  push:
    branches: [main, community-release-v0.2]
    tags: ['v*']
    paths-ignore: ['**/*.md', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
      - run: python3 -m pip install PyYAML
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate.py
      - run: shellcheck -S warning -s sh packaging/*.sh
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target: [armv7, arm64, amd64, mips, mipsle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - run: sh packaging/build.sh "${{ matrix.target }}"
      - run: python3 scripts/package.py "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: firefox-vpn-linux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  prerelease:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify candidate version
        run: |
          case "$(cat VERSION)" in *-rc.*) ;; *) echo 'Only release candidates are published automatically.'; exit 1;; esac
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Publish community testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This version already has a release. Bump VERSION; existing assets will not be replaced.'
            exit 1
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title "Firefox VPN for OpenWrt $tag" --notes-file docs/RELEASE_NOTES.md
